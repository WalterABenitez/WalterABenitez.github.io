<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas</title>
  <link rel="stylesheet" href="style.css">
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>

</head>
<body>

  <div class="app">
    <h1>Lista de Tareas</h1>

    <div class="input-container">
      <input id="taskInput" placeholder="Escribí una tarea" />
      <button id="addTaskBtn">Agregar</button>
</div>
<div class="actions">
     <button id="clearCompleted">Limpiar completadas</button>
     <button id="clearPending">Limpiar no realizadas</button>
</div>

    <p id="counter">Tareas completadas: 0</p>
    <ul id="taskList"></ul>
    <p id="emptyMessage">No tenés tareas pendientes 🎉</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
